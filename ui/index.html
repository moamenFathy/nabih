<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nabih AI Assistant</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Floating Glassmorphic Assistant Card -->
  <main class="widget-card state-idle" id="appCard">

    <!-- Top Bar with Drag Region and Controls -->
    <header class="drag-bar pywebview-drag-region">
      <div class="brand-tag">
        <span class="brand-icon" id="brandIndicator"></span>
        <span class="brand-name">NABIH • نبيه</span>
      </div>
      <div class="window-controls">
        <button class="control-btn" id="closeBtn" title="Close" onclick="window.assistantApp && window.assistantApp.closeWidget()">✕</button>
      </div>
    </header>

    <!-- Glowing Interactive Orb -->
    <section class="orb-stage" id="orbStage" onclick="window.assistantApp && window.assistantApp.toggleListening()">
      <div class="orb-halo" id="orbHalo"></div>
      <div class="orb-ring" id="orbRing"></div>
      <div class="orb-core" id="orbCore"></div>
    </section>

    <!-- State Indicator Badge -->
    <div class="status-pill" id="statusPill">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusLabel">جاهز ومستعد • IDLE</span>
    </div>

    <!-- Live Synchronized Subtitles Area -->
    <section class="subtitles-panel" id="subtitlesPanel">
      <p class="subtitle-text" id="subtitleText">اضغط باستمرار على Caps Lock للتحدث مع نبيه...</p>
    </section>

    <!-- Bottom Keyboard Shortcut Hint -->
    <footer class="hint-bar">
      <span>Push-to-Talk:</span>
      <kbd class="kbd-badge" id="hotkeyBadge">Caps Lock</kbd>
    </footer>

  </main>

  <script src="app.js"></script>
</body>
</html>
